<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldCreator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232f6f9e'/%3E%3Cpath d='M0 11l4-5 3 3 3-5 6 7v5H0z' fill='%234a7c3f'/%3E%3Cpath d='M10 4l3 3.5-1.6 1.2L10 4z' fill='%23eef2f5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      .compass {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 84px;
        text-align: center;
        color: #cfe3f5;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }
      .compass-rose {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.42);
        border: 1px solid rgba(207, 227, 245, 0.28);
        transition: border-color 180ms ease, box-shadow 180ms ease;
      }
      .compass.is-settling .compass-rose {
        border-color: rgba(226, 101, 58, 0.85);
        box-shadow: 0 0 10px rgba(226, 101, 58, 0.35);
      }
      .compass-needle {
        position: absolute;
        left: 50%;
        top: 9px;
        width: 0;
        height: 0;
        margin-left: -6px;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 17px solid #e2653a;
      }
      .compass-label {
        position: absolute;
        font-size: 10px;
        line-height: 1;
        opacity: 0.75;
      }
      .compass-n {
        top: 28px;
        left: 50%;
        margin-left: -3px;
        opacity: 1;
        font-weight: 700;
      }
      .compass-s {
        bottom: 4px;
        left: 50%;
        margin-left: -3px;
      }
      .compass-e {
        right: 5px;
        top: 50%;
        margin-top: -5px;
      }
      .compass-w {
        left: 5px;
        top: 50%;
        margin-top: -5px;
      }
      .compass-keys {
        margin-top: 5px;
        /* Wider than the rose above it, so let it spill rather than wrap. */
        white-space: nowrap;
        letter-spacing: 1px;
        opacity: 0.6;
      }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #cfe3f5;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: pre;
      }

      /* Sits directly above the status bar, sharing its left margin. */
      .credits {
        position: fixed;
        left: 12px;
        bottom: 44px;
        color: #cfe3f5;
        font-size: 11px;
        user-select: none;
      }
      .credits-line {
        display: block;
        padding: 5px 10px;
        border: 0;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: inherit;
        font: inherit;
        opacity: 0.7;
        cursor: pointer;
        transition: opacity 140ms ease;
      }
      .credits-line:hover,
      .credits-line:focus-visible {
        opacity: 1;
      }
      .credits-line strong {
        font-weight: 600;
      }
      .credits-panel {
        position: absolute;
        left: 0;
        bottom: 100%;
        margin-bottom: 8px;
        width: 300px;
        /* Never taller than the viewport it is drawn over. */
        max-height: min(60vh, 520px);
        overflow-y: auto;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid rgba(207, 227, 245, 0.18);
        background: rgba(6, 10, 15, 0.93);
        line-height: 1.5;
      }
      .credits-head strong {
        font-weight: 600;
      }
      .credits-links {
        margin-top: 3px;
        opacity: 0.65;
      }
      .credits-thanks {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(207, 227, 245, 0.14);
        font-weight: 600;
      }
      .credits-note {
        margin-top: 2px;
        opacity: 0.65;
        font-style: italic;
      }
      .credits-patrons {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        /* Sixty names read better as a block than as one long column. */
        columns: 2;
        column-gap: 16px;
        opacity: 0.8;
      }
      .credits-patrons li {
        break-inside: avoid;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
