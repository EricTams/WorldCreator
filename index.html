<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldCreator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232f6f9e'/%3E%3Cpath d='M0 11l4-5 3 3 3-5 6 7v5H0z' fill='%234a7c3f'/%3E%3Cpath d='M10 4l3 3.5-1.6 1.2L10 4z' fill='%23eef2f5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      .compass {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 84px;
        text-align: center;
        color: #cfe3f5;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }
      .compass-rose {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.42);
        border: 1px solid rgba(207, 227, 245, 0.28);
      }
      .compass-needle {
        position: absolute;
        left: 50%;
        top: 9px;
        width: 0;
        height: 0;
        margin-left: -6px;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 17px solid #e2653a;
      }
      .compass-label {
        position: absolute;
        font-size: 10px;
        line-height: 1;
        opacity: 0.75;
      }
      .compass-n {
        top: 28px;
        left: 50%;
        margin-left: -3px;
        opacity: 1;
        font-weight: 700;
      }
      .compass-s {
        bottom: 4px;
        left: 50%;
        margin-left: -3px;
      }
      .compass-e {
        right: 5px;
        top: 50%;
        margin-top: -5px;
      }
      .compass-w {
        left: 5px;
        top: 50%;
        margin-top: -5px;
      }
      .compass-keys {
        margin-top: 5px;
        letter-spacing: 1.5px;
        opacity: 0.6;
      }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #cfe3f5;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
