<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the fixed UI reach under the notch and home bar
      and position itself with env(safe-area-inset-*); the scale lock stops a
      double-tap on the d-pad zooming the page instead of moving the avatar.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>WorldCreator</title>
    <!--
      Launched from a home-screen icon, this should be the game and not a page
      about the game. Without `apple-mobile-web-app-capable` iOS opens the icon
      in a Safari view complete with a top bar and a bottom toolbar, and since
      the canvas is full-bleed (viewport-fit=cover, above) that toolbar sits on
      top of the lower strip of it — which is what put the avatar at the bottom
      middle of the screen instead of the middle. Standalone removes the bars
      rather than compensating for them.

      `black-translucent` keeps the status bar out of the layout so the picture
      still reaches the top edge; the safe-area insets it leaves behind are read
      by the camera (see render/camera.ts) and framed around.

      Anyone who added the icon before this shipped has to re-add it — iOS
      decides standalone-or-not when the icon is created, not when it is opened.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WorldCreator" />
    <meta name="theme-color" content="#0b0f14" />
    <!--
      The bundles are content-hashed and can be cached forever; this file names
      them and therefore must not be. GitHub Pages serves no headers we control,
      so this is the only lever available — honestly a weak one, since a
      standalone iOS app may still hold a copy. The build marker in the corner
      is the backstop: it tells you when you are looking at a stale one.
    -->
    <meta http-equiv="Cache-Control" content="no-cache" />
    <!--
      Relative, not root-absolute: the page is served from /WorldCreator/ once
      deployed and from / by the dev server, and a relative href is correct in
      both. iOS ignores the manifest's icons and uses the apple-touch-icon.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232f6f9e'/%3E%3Cpath d='M0 11l4-5 3 3 3-5 6 7v5H0z' fill='%234a7c3f'/%3E%3Cpath d='M10 4l3 3.5-1.6 1.2L10 4z' fill='%23eef2f5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        /* The notch and the home bar, republished as custom properties so the
           renderer can read them. `env()` is only usable inside CSS, and the
           camera needs the numbers: the canvas runs full-bleed underneath both
           (viewport-fit=cover, above), so these are the strips of it nobody can
           see, and the view has to be centred on what is left. */
        --inset-top: env(safe-area-inset-top, 0px);
        --inset-right: env(safe-area-inset-right, 0px);
        --inset-bottom: env(safe-area-inset-bottom, 0px);
        --inset-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        /* The canvas has no touch gestures of its own, so hand every touch that
           lands on it to nobody rather than to pull-to-refresh or pinch-zoom. */
        touch-action: none;
      }
      /* The canvas fills its container rather than carrying a pixel size of its
         own. The renderer sets the drawing buffer and leaves the display size
         alone (see render/scene.ts), so the picture always covers the screen
         even on the frame after a rotation, when the measured size is briefly
         the old one. Without this the canvas laid out at whatever was last
         measured, pinned to the top-left corner. */
      #app > canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .compass {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 84px;
        text-align: center;
        color: #cfe3f5;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }
      .compass-rose {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.42);
        border: 1px solid rgba(207, 227, 245, 0.28);
        transition: border-color 180ms ease, box-shadow 180ms ease;
      }
      .compass.is-settling .compass-rose {
        border-color: rgba(226, 101, 58, 0.85);
        box-shadow: 0 0 10px rgba(226, 101, 58, 0.35);
      }
      .compass-needle {
        position: absolute;
        left: 50%;
        top: 9px;
        width: 0;
        height: 0;
        margin-left: -6px;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 17px solid #e2653a;
      }
      .compass-label {
        position: absolute;
        font-size: 10px;
        line-height: 1;
        opacity: 0.75;
      }
      .compass-n {
        top: 28px;
        left: 50%;
        margin-left: -3px;
        opacity: 1;
        font-weight: 700;
      }
      .compass-s {
        bottom: 4px;
        left: 50%;
        margin-left: -3px;
      }
      .compass-e {
        right: 5px;
        top: 50%;
        margin-top: -5px;
      }
      .compass-w {
        left: 5px;
        top: 50%;
        margin-top: -5px;
      }
      .compass-keys {
        margin-top: 5px;
        /* Wider than the rose above it, so let it spill rather than wrap. */
        white-space: nowrap;
        letter-spacing: 1px;
        opacity: 0.6;
      }

      /* --- Phone presentation --------------------------------------------
         `is-touch` goes on the body once there's evidence of a touchscreen
         (see ui/touchMode.ts). Everything that exists to *build* a world goes
         away, leaving what you need to walk around one: the parameter panel,
         the stats readout, and the keyboard hints under the compass are all
         either unusable or unreadable on a phone.

         The attribution line stays — the art licence asks for credit on
         screen, which is not conditional on screen size. */
      body.is-touch .lil-gui.autoPlace,
      body.is-touch #status,
      body.is-touch .compass-keys {
        display: none;
      }

      /* --- Movement pad -------------------------------------------------
         Thumb-reachable bottom corner, clear of the status line and credits on
         the left. Hidden until something tells us there's a touchscreen. */
      .dpad {
        position: fixed;
        right: calc(18px + env(safe-area-inset-right));
        bottom: calc(18px + env(safe-area-inset-bottom));
        display: none;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 4px;
        /* Capped against viewport *height*: play is landscape-only, so the
           short axis is the one that runs out, and a pad taller than a third of
           it stops being a thumb's reach. */
        width: min(174px, 38vh);
        height: min(174px, 38vh);
        padding: 6px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.42);
        border: 1px solid rgba(207, 227, 245, 0.28);
        /* Below lil-gui: an opened panel is working space and should win. */
        z-index: 10;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body.is-touch .dpad {
        display: grid;
      }
      .dpad-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        background: rgba(207, 227, 245, 0.08);
        color: #cfe3f5;
        font-size: 15px;
        line-height: 1;
        opacity: 0.6;
        transition: background-color 90ms ease, opacity 90ms ease;
      }
      .dpad-cell.is-active {
        background: rgba(226, 101, 58, 0.85);
        opacity: 1;
      }
      /* The deadzone reads as a hole in the ring rather than a ninth button. */
      .dpad-hub {
        background: none;
      }
      .dpad-arrow {
        display: block;
      }

      /* --- Orientation ---------------------------------------------------
         Play is landscape-only: the board wants the wide axis, and in portrait
         the pad and the panel would between them own the screen. Rather than
         let a phone into a view that doesn't work, cover it and say so. Purely
         a media query — nothing pauses, so turning the phone resumes exactly
         where it was. Desktops are exempt: a tall window is a choice there. */
      .rotate-hint {
        display: none;
      }
      @media (orientation: portrait) {
        body.is-touch .rotate-hint {
          position: fixed;
          inset: 0;
          /* Above lil-gui's 1001, so nothing shows through if the panel is
             ever brought back on touch. */
          z-index: 2000;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0b0f14;
          color: #cfe3f5;
          font-size: 15px;
          text-align: center;
          user-select: none;
          -webkit-user-select: none;
        }
        .rotate-hint-phone {
          width: 46px;
          height: 74px;
          border: 2px solid rgba(207, 227, 245, 0.7);
          border-radius: 9px;
          /* Caught mid-turn, which reads as "keep going" better than a static
             upright phone does. */
          transform: rotate(-58deg);
          animation: rotate-hint-tip 2.6s ease-in-out infinite;
        }
        .rotate-hint-note {
          opacity: 0.55;
          font-size: 12px;
        }
        /* The way out of a dead end. Chat apps open links in an embedded
           viewer that is pinned to portrait, so for anyone arriving from one
           the instruction above is impossible to follow and the game is simply
           a wall — turning the phone does nothing. Shown to everyone rather
           than sniffed for: the user agents are a moving target, and it costs
           a line of small print to people who can just rotate. */
        .rotate-hint-escape {
          max-width: 20em;
          margin: 0 22px;
          padding-top: 14px;
          border-top: 1px solid rgba(207, 227, 245, 0.14);
          opacity: 0.5;
          font-size: 12px;
          line-height: 1.5;
        }
      }
      @keyframes rotate-hint-tip {
        0%,
        18% {
          transform: rotate(0deg);
        }
        55%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rotate-hint-phone {
          animation: none;
          transform: rotate(-90deg);
        }
      }

      /* --- Game HUD -------------------------------------------------------
         The match, over the map. The wrapper itself never catches the pointer —
         a click that misses a button is a click on the world, and throwing a
         fireball must not be blocked by an invisible full-screen div. Only the
         controls opt back in with pointer-events: auto. */
      .hud {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        color: #dce8f4;
        font-size: 12px;
        user-select: none;
        -webkit-user-select: none;
      }
      .hud button {
        pointer-events: auto;
        font: inherit;
        cursor: pointer;
      }
      /* `hidden` has to beat the layout rules below. The attribute's own
         `display: none` comes from the UA stylesheet at element specificity, so
         any class here that sets `display` silently overrides it — which is how
         the end-of-match overlay ended up covering a live match. */
      .hud [hidden] {
        display: none !important;
      }
      .hud kbd {
        padding: 1px 5px;
        border: 1px solid rgba(220, 232, 244, 0.35);
        border-radius: 4px;
        font-size: 10px;
        font-family: inherit;
        opacity: 0.8;
      }

      /* The charge race. Top centre, because it is the clock everyone is
         playing against and it should never be somewhere you have to look. */
      .hud-charge {
        position: absolute;
        left: 50%;
        top: calc(10px + env(safe-area-inset-top));
        transform: translateX(-50%);
        min-width: 300px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        font-variant-numeric: tabular-nums;
      }
      .hud-charge-row {
        display: grid;
        grid-template-columns: 76px 1fr 38px 44px;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
        opacity: 0.75;
      }
      .hud-charge-row.is-you {
        opacity: 1;
        font-weight: 600;
      }
      .hud-charge-bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(220, 232, 244, 0.14);
        overflow: hidden;
      }
      .hud-charge-bar > span {
        display: block;
        height: 100%;
        transition: width 240ms linear;
      }
      .hud-charge-num {
        text-align: right;
      }
      .hud-charge-points {
        letter-spacing: 1px;
        opacity: 0.7;
      }

      .hud-toast {
        position: absolute;
        left: 50%;
        top: calc(96px + env(safe-area-inset-top));
        transform: translateX(-50%);
        padding: 7px 14px;
        border-radius: 6px;
        background: rgba(226, 101, 58, 0.9);
        color: #fff;
        white-space: nowrap;
      }

      /* Army roster, right edge, sorted by distance to the wizard. */
      .hud-armies {
        position: absolute;
        right: calc(10px + env(safe-area-inset-right));
        top: 50%;
        transform: translateY(-50%);
        width: 194px;
        max-height: 70vh;
        overflow-y: auto;
        pointer-events: auto;
      }
      .hud-armies-head {
        padding: 0 4px 5px;
        font-size: 10px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        opacity: 0.5;
      }
      .hud-armies-empty {
        padding: 9px 10px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0.6;
        line-height: 1.45;
      }
      .hud-army {
        display: block;
        width: 100%;
        margin-bottom: 5px;
        padding: 7px 9px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.55);
        color: inherit;
        text-align: left;
        transition: background-color 120ms ease, border-color 120ms ease;
      }
      .hud-army:hover {
        background: rgba(20, 32, 46, 0.85);
      }
      .hud-army.is-selected {
        border-color: rgba(226, 101, 58, 0.9);
        background: rgba(40, 26, 20, 0.9);
      }
      .hud-army-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .hud-army-home {
        font-weight: 600;
      }
      .hud-army-pips {
        display: flex;
        gap: 2px;
      }
      .hud-pip {
        width: 5px;
        height: 9px;
        border-radius: 1px;
        background: #7fc27a;
      }
      .hud-pip.is-bearer {
        background: #d8c463;
      }
      .hud-pip.is-dead {
        background: rgba(220, 232, 244, 0.16);
      }
      .hud-army-verb {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        opacity: 0.62;
      }
      .hud-army-bar {
        display: block;
        height: 3px;
        margin-top: 5px;
        border-radius: 2px;
        background: rgba(220, 232, 244, 0.14);
        overflow: hidden;
      }
      .hud-army-bar > span {
        display: block;
        height: 100%;
        background: #7fc27a;
      }

      /* Everything that answers "what can I do right now", stacked above the
         status bar so the two never overlap. */
      .hud-bottom {
        position: absolute;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .hud-prompt {
        text-align: center;
      }
      .hud-prompt-note {
        padding: 5px 11px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        opacity: 0.8;
      }
      .hud-action {
        padding: 8px 16px;
        border: 1px solid rgba(226, 101, 58, 0.85);
        border-radius: 7px;
        background: rgba(226, 101, 58, 0.22);
        color: #fff;
      }
      .hud-action:hover {
        background: rgba(226, 101, 58, 0.42);
      }
      .hud-channel {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 13px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.62);
      }
      .hud-channel-bar,
      .hud-queue-bar {
        display: block;
        width: 140px;
        height: 6px;
        border-radius: 3px;
        background: rgba(220, 232, 244, 0.14);
        overflow: hidden;
      }
      .hud-channel-bar > span,
      .hud-queue-bar > span {
        display: block;
        height: 100%;
        background: #e2653a;
      }

      .hud-city {
        padding: 8px 11px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.62);
        text-align: center;
      }
      .hud-city-name {
        margin-bottom: 6px;
        font-weight: 600;
      }
      .hud-build-row,
      .hud-queue {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .hud-build {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 12px;
        border: 1px solid rgba(220, 232, 244, 0.24);
        border-radius: 6px;
        background: rgba(220, 232, 244, 0.06);
        color: inherit;
      }
      .hud-build:hover:not(:disabled) {
        background: rgba(220, 232, 244, 0.16);
      }
      .hud-build:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .hud-build span {
        font-size: 10px;
        opacity: 0.65;
      }
      .hud-queue-time {
        font-variant-numeric: tabular-nums;
        opacity: 0.7;
      }

      /* --- Spellbook -----------------------------------------------------
         Two spells, always both on screen. A spell you own should be visible
         whether or not it can be cast this second — the greying out is the
         information, not the absence. */
      .hud-hotbar {
        display: flex;
        gap: 6px;
      }
      .hud-spell {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 7px;
        border: 1px solid rgba(220, 232, 244, 0.2);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: inherit;
        /* Dimmed until castable. The slot never disappears, so the spellbook is
           a constant and only its availability moves. */
        opacity: 0.45;
        transition: opacity 120ms ease, border-color 120ms ease, background-color 120ms ease;
      }
      .hud-spell.is-ready {
        opacity: 1;
      }
      .hud-spell:hover {
        border-color: rgba(220, 232, 244, 0.45);
      }
      .hud-spell.is-armed {
        opacity: 1;
        border-color: rgba(226, 101, 58, 0.95);
        background: rgba(226, 101, 58, 0.28);
      }
      .hud-spell-key {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: rgba(220, 232, 244, 0.14);
        font-size: 11px;
        font-weight: 700;
      }
      .hud-spell.is-armed .hud-spell-key {
        background: rgba(255, 255, 255, 0.28);
      }
      .hud-spell-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1.25;
      }
      .hud-spell-name {
        font-weight: 600;
      }
      .hud-spell-cost {
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        opacity: 0.68;
      }

      .hud-vitals {
        display: grid;
        grid-template-columns: 150px auto 150px auto auto;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        font-variant-numeric: tabular-nums;
      }
      .hud-bar {
        height: 9px;
        border-radius: 5px;
        background: rgba(220, 232, 244, 0.14);
        overflow: hidden;
      }
      .hud-bar > span {
        display: block;
        height: 100%;
        transition: width 120ms linear;
      }
      .hud-bar-hp > span {
        background: #d1544a;
      }
      .hud-bar-mana > span {
        background: #4a90d1;
      }
      .hud-bar-label {
        opacity: 0.7;
      }
      .hud-gold {
        padding-left: 8px;
        border-left: 1px solid rgba(220, 232, 244, 0.16);
        color: #e8c96a;
      }

      .hud-end {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(6, 10, 15, 0.82);
        pointer-events: auto;
      }
      .hud-end-card {
        max-width: 30em;
        padding: 28px 34px;
        border: 1px solid rgba(220, 232, 244, 0.18);
        border-radius: 12px;
        background: rgba(10, 16, 23, 0.95);
        text-align: center;
      }
      .hud-end-title {
        font-size: 20px;
        font-weight: 600;
      }
      .hud-end-note {
        margin: 10px 0 20px;
        opacity: 0.7;
        line-height: 1.55;
      }

      /* On a phone the roster and the build menu are the first things to go —
         the d-pad owns the bottom right, and a 194px panel over a 2 km island
         on a 5 inch screen is most of the map. Vitals and the charge race stay:
         they are the two things you cannot play without. */
      body.is-touch .hud-armies {
        width: 138px;
        font-size: 11px;
      }
      /* Clear of the credit line, which keeps its corner on every screen. */
      body.is-touch .hud-bottom {
        left: 12px;
        bottom: calc(70px + env(safe-area-inset-bottom));
        transform: none;
        align-items: flex-start;
      }
      body.is-touch .hud-vitals {
        grid-template-columns: 92px auto 92px auto;
      }
      body.is-touch .hud-gold {
        grid-column: 1 / -1;
        padding: 0;
        border: 0;
      }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #cfe3f5;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: pre;
      }

      /* Sits directly above the status bar, sharing its left margin. */
      .credits {
        position: fixed;
        left: 12px;
        bottom: 44px;
        color: #cfe3f5;
        font-size: 11px;
        user-select: none;
      }
      .credits-row {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      /* Which build is on screen. Quiet enough to ignore while playing, legible
         enough to read off a phone without zooming — the whole point is that
         you can answer "did it update?" without a console. */
      .credits-build {
        padding: 4px 7px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.3px;
        opacity: 0.6;
        white-space: nowrap;
      }
      .credits-line {
        display: block;
        padding: 5px 10px;
        border: 0;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: inherit;
        font: inherit;
        opacity: 0.7;
        cursor: pointer;
        transition: opacity 140ms ease;
      }
      .credits-line:hover,
      .credits-line:focus-visible {
        opacity: 1;
      }
      .credits-line strong {
        font-weight: 600;
      }
      .credits-panel {
        position: absolute;
        left: 0;
        bottom: 100%;
        margin-bottom: 8px;
        width: 300px;
        /* Never taller than the viewport it is drawn over. */
        max-height: min(60vh, 520px);
        overflow-y: auto;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid rgba(207, 227, 245, 0.18);
        background: rgba(6, 10, 15, 0.93);
        line-height: 1.5;
      }
      .credits-head strong {
        font-weight: 600;
      }
      .credits-links {
        margin-top: 3px;
        opacity: 0.65;
      }
      .credits-thanks {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(207, 227, 245, 0.14);
        font-weight: 600;
      }
      .credits-note {
        margin-top: 2px;
        opacity: 0.65;
        font-style: italic;
      }
      .credits-patrons {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        /* Sixty names read better as a block than as one long column. */
        columns: 2;
        column-gap: 16px;
        opacity: 0.8;
      }
      .credits-patrons li {
        break-inside: avoid;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"></div>
    <div class="rotate-hint">
      <div class="rotate-hint-phone"></div>
      <div>
        Turn your phone sideways
        <div class="rotate-hint-note">WorldCreator plays in landscape</div>
      </div>
      <div class="rotate-hint-escape">
        Nothing happening when you turn it? You've opened this from a chat app,
        and its built-in browser can't rotate. Use its menu to open the page in
        Safari or Chrome.
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
